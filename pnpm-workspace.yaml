packages:
  - apps/*
  - packages/*
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  protobufjs: false
  sdd-spec-check: true
# Off for Renovate. Manual installs and transitive deps are not gated.
minimumReleaseAge: 0
overrides:
  esbuild: 0.28.2
  zod: 4.6.6
  vite: 8.3.4
  body-parser: 2.4.0
  undici: 7.30.1
  fast-uri: 3.1.9
  ip-address: 10.7.4

# braces has no patched version yet. It only comes in through the shadcn CLI, a dev-time tool.
# Remove this when a braces version above 3.0.3 is published.
# The better-auth oauth-provider fix only exists in a 1.7 beta.
# Remove this after the better-auth 1.7 migration.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-p2fr-6hmx-4528
