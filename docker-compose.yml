services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thoth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.11.1-alpine
    command: -connectRetries=10 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/thoth
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
    volumes:
      - ./apps/api/sql:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "3002:3002"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/thoth
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    develop:
      watch:
        - action: rebuild
          path: pnpm-lock.yaml

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      API_URL: http://api:3002
      PUBLIC_API_URL: http://localhost:3002
      SITE_HANDLE: ${SITE_HANDLE:-markus-azer}
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/dist
    develop:
      watch:
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  pgdata:
