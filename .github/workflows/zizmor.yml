name: Zizmor

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: zizmor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uploads SARIF to the Security tab. Free for public repos via GitHub Advanced Security.
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
